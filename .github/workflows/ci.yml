name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-start-check:
    runs-on: ubuntu-latest

    steps:
      # 拉取仓库代码，后续步骤会基于这份代码安装依赖和执行构建。
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Node.js 20，前端和后端都使用这个 Node.js 版本运行。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 安装前端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 构建 React + Vite 前端；如果编译失败，Workflow 会直接失败。
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 安装后端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 启动 Express 后端，并检查健康检查接口是否能正常响应。
      - name: Check backend startup
        working-directory: backend
        run: |
          npm start &
          SERVER_PID=$!

          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:4000/api/health; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" 2>/dev/null || true
              exit 0
            fi

            sleep 1
          done

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "后端未能通过 /api/health 健康检查"
          exit 1

      # 初始化 Docker Buildx，用于在 CI 中执行 Docker 镜像构建。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 规范化 ACR_REGISTRY，并从常见 ACR 域名格式中推断阿里云地域。
      - name: Resolve ACR region
        id: acr
        shell: bash
        run: |
          REGISTRY="${{ secrets.ACR_REGISTRY }}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          REGISTRY="${REGISTRY%%/*}"

          REGION="$(echo "$REGISTRY" | sed -nE 's/^registry(-[a-z0-9]+)?\.([a-z0-9-]+)\.aliyuncs\.com$/\2/p')"

          if [ -z "$REGION" ]; then
            REGION="$(echo "$REGISTRY" | sed -nE 's/^.*-registry(-[a-z0-9]+)?\.([a-z0-9-]+)\.cr\.aliyuncs\.com$/\2/p')"
          fi

          if [ -z "$REGION" ]; then
            REGION="$(echo "$REGISTRY" | sed -nE 's/^.*\.([a-z0-9-]+)\.personal\.cr\.aliyuncs\.com$/\1/p')"
          fi

          if [ -z "$REGION" ]; then
            REGION="$(echo "$REGISTRY" | grep -oE '(cn|us|eu|ap|me|sa|na)-[a-z0-9-]+(-[0-9]+)?' | head -n 1)"
          fi

          if [ -z "$REGION" ]; then
            echo "无法从 ACR_REGISTRY 推断阿里云地域"
            exit 1
          fi

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      # 登录阿里云 ACR，AccessKey 从 GitHub Secrets 读取，不在日志中明文展示。
      - name: Log in to Alibaba Cloud ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://${{ steps.acr.outputs.registry }}
          region-id: ${{ steps.acr.outputs.region }}
          endpoint: https://cr.${{ steps.acr.outputs.region }}.aliyuncs.com
          access-key-id: ${{ secrets.ACR_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ACR_ACCESS_KEY_SECRET }}

      # 构建前端 Docker 镜像，并推送 latest 标签到阿里云 ACR。
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.registry }}/${{ secrets.ACR_NAMESPACE }}/easyflow-frontend:latest
          build-args: |
            VITE_API_URL=http://localhost:4000
          provenance: false

      # 构建后端 Docker 镜像，并推送 latest 标签到阿里云 ACR。
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.registry }}/${{ secrets.ACR_NAMESPACE }}/easyflow-backend:latest
          provenance: false
