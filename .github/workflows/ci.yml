name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-start-check:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository source code so the workflow can install and build it.
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js 20, which is the runtime used by both frontend and backend.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Install frontend dependencies from package-lock.json for repeatable builds.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Build the React + Vite frontend and fail the workflow if compilation fails.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Install backend dependencies from package-lock.json for repeatable checks.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Start the Express backend and verify the health endpoint responds.
      - name: Check backend startup
        working-directory: backend
        run: |
          npm start &
          SERVER_PID=$!

          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:4000/api/health; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" 2>/dev/null || true
              exit 0
            fi

            sleep 1
          done

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Backend did not respond on /api/health"
          exit 1
