name: EasyFlow 持续集成

on:
  push:
    branches:
      - main

jobs:
  build-and-start-check:
    name: 前后端构建与镜像发布
    runs-on: ubuntu-latest

    steps:
      # 拉取仓库代码，后续步骤会基于这份代码安装依赖和执行构建。
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装 Node.js 20，前端和后端都使用这个 Node.js 版本运行。
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 安装前端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: 安装前端依赖
        working-directory: frontend
        run: |
          echo "开始安装前端依赖"
          npm ci
          echo "前端依赖安装完成"

      # 构建 React + Vite 前端；如果编译失败，Workflow 会直接失败。
      - name: 构建前端项目
        working-directory: frontend
        run: |
          echo "开始构建前端项目"
          npm run build
          echo "前端构建完成"

      # 安装后端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: 安装后端依赖
        working-directory: backend
        run: |
          echo "开始安装后端依赖"
          npm ci
          echo "后端依赖安装完成"

      # 启动 Express 后端，并检查健康检查接口是否能正常响应。
      - name: 检查后端服务启动
        working-directory: backend
        run: |
          echo "开始检查后端启动"
          npm start &
          SERVER_PID=$!

          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:4000/api/health; then
              echo "后端启动检查通过"
              kill "$SERVER_PID"
              wait "$SERVER_PID" 2>/dev/null || true
              exit 0
            fi

            sleep 1
          done

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "后端未能通过 /api/health 健康检查"
          exit 1

      # 初始化 Docker Buildx，用于在 CI 中执行 Docker 镜像构建。
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云 ACR 个人版，用户名和密码从 GitHub Secrets 读取，不在日志中明文展示。
      - name: 登录阿里云容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 输出前端镜像发布信息
        run: echo "开始构建并推送前端镜像"

      # 构建前端 Docker 镜像，并推送 latest 标签到阿里云 ACR。
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/easyflow-frontend:latest
          build-args: |
            VITE_API_URL=http://localhost:4000
          provenance: false

      - name: 输出后端镜像发布信息
        run: echo "开始构建并推送后端镜像"

      # 构建后端 Docker 镜像，并推送 latest 标签到阿里云 ACR。
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/easyflow-backend:latest
          provenance: false
