name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-start-check:
    runs-on: ubuntu-latest

    steps:
      # 拉取仓库代码，后续步骤会基于这份代码安装依赖和执行构建。
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Node.js 20，前端和后端都使用这个 Node.js 版本运行。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 安装前端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 构建 React + Vite 前端；如果编译失败，Workflow 会直接失败。
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 安装后端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 启动 Express 后端，并检查健康检查接口是否能正常响应。
      - name: Check backend startup
        working-directory: backend
        run: |
          npm start &
          SERVER_PID=$!

          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:4000/api/health; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" 2>/dev/null || true
              exit 0
            fi

            sleep 1
          done

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "后端未能通过 /api/health 健康检查"
          exit 1
