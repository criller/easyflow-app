name: EasyFlow 持续集成

on:
  push:
    branches:
      - main

jobs:
  build-and-start-check:
    name: 前后端构建与镜像发布
    runs-on: ubuntu-latest
    env:
      FRONTEND_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/easyflow-frontend
      BACKEND_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/easyflow-backend

    steps:
      # 拉取仓库代码，后续步骤会基于这份代码安装依赖和执行构建。
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装 Node.js 20，前端和后端都使用这个 Node.js 版本运行。
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 安装前端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: 安装前端依赖
        working-directory: frontend
        run: |
          echo "开始安装前端依赖"
          npm ci
          echo "前端依赖安装完成"

      # 构建 React + Vite 前端；如果编译失败，Workflow 会直接失败。
      - name: 构建前端项目
        id: frontend_build
        working-directory: frontend
        run: |
          echo "开始构建前端项目"
          npm run build
          echo "前端构建完成"

      # 安装后端依赖，使用 package-lock.json 保证依赖版本可重复。
      - name: 安装后端依赖
        working-directory: backend
        run: |
          echo "开始安装后端依赖"
          npm ci
          echo "后端依赖安装完成"

      # 启动 Express 后端，并检查健康检查接口是否能正常响应。
      - name: 检查后端服务启动
        id: backend_build
        working-directory: backend
        run: |
          echo "开始检查后端启动"
          npm start &
          SERVER_PID=$!

          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:4000/api/health; then
              echo "后端启动检查通过"
              kill "$SERVER_PID"
              wait "$SERVER_PID" 2>/dev/null || true
              exit 0
            fi

            sleep 1
          done

          kill "$SERVER_PID"
          wait "$SERVER_PID" 2>/dev/null || true
          echo "后端未能通过 /api/health 健康检查"
          exit 1

      # 初始化 Docker Buildx，用于在 CI 中执行 Docker 镜像构建。
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云 ACR 个人版，用户名和密码从 GitHub Secrets 读取，不在日志中明文展示。
      - name: 登录阿里云容器镜像仓库
        id: acr_login
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 输出前端镜像发布信息
        run: echo "开始构建并推送前端镜像"

      # 构建前端 Docker 镜像，并推送 latest 标签到阿里云 ACR。
      - name: 构建并推送前端镜像
        id: frontend_image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://localhost:4000
          provenance: false

      - name: 输出后端镜像发布信息
        run: echo "开始构建并推送后端镜像"

      # 构建后端 Docker 镜像，并推送 latest 标签到阿里云 ACR。
      - name: 构建并推送后端镜像
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          provenance: false

      # 输出企业级中文构建报告；不影响 Docker Build Summary 的默认输出。
      - name: 输出 EasyFlow 构建报告
        if: always()
        env:
          FRONTEND_BUILD_STATUS: ${{ steps.frontend_build.outcome }}
          BACKEND_BUILD_STATUS: ${{ steps.backend_build.outcome }}
          ACR_LOGIN_STATUS: ${{ steps.acr_login.outcome }}
          FRONTEND_IMAGE_STATUS: ${{ steps.frontend_image.outcome }}
          BACKEND_IMAGE_STATUS: ${{ steps.backend_image.outcome }}
        run: |
          status_cn() {
            case "$1" in
              success) echo "成功" ;;
              failure) echo "失败" ;;
              cancelled) echo "取消" ;;
              skipped) echo "跳过" ;;
              *) echo "${1:-未知}" ;;
            esac
          }

          if [ "$FRONTEND_IMAGE_STATUS" = "success" ] && [ "$BACKEND_IMAGE_STATUS" = "success" ]; then
            DOCKER_BUILD_STATUS="success"
            PUSH_ACR_STATUS="success"
          else
            DOCKER_BUILD_STATUS="failure"
            PUSH_ACR_STATUS="failure"
          fi

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "# EasyFlow 构建报告"
            echo
            echo "## Git 信息"
            echo
            echo "* 分支：${{ github.ref_name }}"
            echo "* Commit SHA：${{ github.sha }}"
            echo "* 短版本号：$SHORT_SHA"
            echo "* 提交人：${{ github.actor }}"
            echo "* 构建时间：$BUILD_TIME"
            echo
            echo "## 前端镜像"
            echo
            echo "* 镜像仓库地址：$FRONTEND_IMAGE"
            echo "* latest Tag：$FRONTEND_IMAGE:latest"
            echo "* Commit Tag：$FRONTEND_IMAGE:${{ github.sha }}"
            echo "* 短版本 Tag：$FRONTEND_IMAGE:$SHORT_SHA"
            echo
            echo "## 后端镜像"
            echo
            echo "* 镜像仓库地址：$BACKEND_IMAGE"
            echo "* latest Tag：$BACKEND_IMAGE:latest"
            echo "* Commit Tag：$BACKEND_IMAGE:${{ github.sha }}"
            echo "* 短版本 Tag：$BACKEND_IMAGE:$SHORT_SHA"
            echo
            echo "## 构建结果"
            echo
            echo "* Frontend Build：$(status_cn "$FRONTEND_BUILD_STATUS")"
            echo "* Backend Build：$(status_cn "$BACKEND_BUILD_STATUS")"
            echo "* Docker Build：$(status_cn "$DOCKER_BUILD_STATUS")"
            echo "* Push ACR：$(status_cn "$PUSH_ACR_STATUS")"
          } >> "$GITHUB_STEP_SUMMARY"
